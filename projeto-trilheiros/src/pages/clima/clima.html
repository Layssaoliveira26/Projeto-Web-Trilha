<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima — Trilheiros Na Pedra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/clima.css" />
    <script type="module" src="../../main.js"></script>
  </head>
  <body>
    <div id="navbar-container"></div>
    <header class="cl-header">
      <div class="cl-header__inner">
        <div>
          <p class="cl-header__eyebrow">Planejamento</p>
          <h1 class="cl-header__titulo">Clima</h1>
          <p class="cl-header__sub">
            Previsão e planejamento para os próximos 7 dias.
          </p>
        </div>
        <div class="cl-header__badge" id="badgeAtualizacao">
          <!-- preenchido pelo JS -->
        </div>
      </div>
    </header>

    <div class="cl-toggle-bar">
      <label class="cl-toggle">
        <input type="checkbox" id="toggleFavoraveis" />
        <span class="cl-toggle__pill"></span>
        <span class="cl-toggle__label">Mostrar apenas dias favoráveis</span>
      </label>
    </div>

    <section class="cl-semana">
      <div class="cl-semana__trilho" id="gridSemana"></div>
    </section>

    <footer class="cl-footer">
      <svg
        class="cl-footer__icone"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
        />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
      <p>
        <strong>Atenção:</strong> A natureza é imprevisível. As recomendações
        são baseadas em previsões meteorológicas locais. Sempre verifique o céu
        ao chegar no local da trilha. Use calçados adequados e leve água.
      </p>
    </footer>

    <script type="module" src="clima.js"></script>
    <div id="footer-container"></div>
  </body>
</html>
